<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="BEON.tech">
  <!-- El único rayo de marca que hay en el repo es blanco (assets/beon-bolt-white.png,
       usado en el sidebar sobre un fondo con gradiente). Acá se usa como máscara y se
       pinta con el azul de marca (--blue, #3A69FF): sobre la pestaña, que puede ser
       clara u oscura, un rayo blanco sin fondo sería invisible. Así queda un solo
       archivo de origen para la forma del rayo, sin una segunda copia que mantener. -->
  <mask id="bolt" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <image x="-2.46" y="-2.46" width="132.92" height="132.92" href="data:image/png;base64,"/>
  </mask>
  <rect width="128" height="128" fill="#3A69FF" mask="url(#bolt)"/>
</svg>
